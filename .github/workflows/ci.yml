name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:types:check
      - run: npm test
      - run: npm run tools:postgrest
      - run: POSTGREST_BIN=.test-tools/postgrest npm run verify:postgrest
      - run: npm run verify:scale
      - run: sudo apt-get update && sudo apt-get install -y postgresql-common
      - run: sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
      - run: sudo apt-get install -y postgresql-client-18
      - run: npm run verify:recovery
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:cross
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
