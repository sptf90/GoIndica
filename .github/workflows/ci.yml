name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: docker pull mariadb:10.11
      - run: TEST_MYSQL_IMAGE=mariadb:10.11 npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: TEST_MYSQL_IMAGE=mariadb:10.11 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
